name: Publish to npm and GitHub Release

on:
  # 默认分支相关源码或版本更新时触发
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "server.json"
      - "src/**"
      - "addons/vino_godot_mcp/**"
      - "godot_test/addons/vino-godot-mcp/**"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/publish.yml"

  # 支持手动触发
  workflow_dispatch:

# 防止多个发布任务同时执行
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
      # 1. 获取仓库代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 运行测试
      - name: Run tests
        run: npm test

      # 5. 校验三处版本号一致性并准备 Tag 与带前缀的 Release 名称
      - name: Check version consistency and prepare tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          
          # 设定带有产品前缀的 GitHub Release 标题，而 Tag 保持纯净的 vX.Y.Z
          RELEASE_NAME="Vino Godot MCP v${VERSION}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi

          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "::error::Missing npm package name"
            exit 1
          fi

          # ----------------------------------------------------
          # 版本号一致性闸门 (package.json / server.json / plugin.cfg)
          # ----------------------------------------------------
          node -e '
            const fs = require("fs");
            const pkgVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            
            let serverRootVersion = null;
            let serverPkgVersion = null;
            if (fs.existsSync("server.json")) {
              const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
              serverRootVersion = srv.version;
              serverPkgVersion = srv.packages?.[0]?.version ?? serverRootVersion;
            }

            const pluginCfgPath = "godot_test/addons/vino-godot-mcp/plugin.cfg";
            if (!fs.existsSync(pluginCfgPath)) {
              console.error(`::error::Missing plugin.cfg at ${pluginCfgPath}`);
              process.exit(1);
            }
            const pluginCfg = fs.readFileSync(pluginCfgPath, "utf8");
            const pluginMatch = pluginCfg.match(/^\s*version\s*=\s*"([^"]+)"/m);
            const pluginVersion = pluginMatch ? pluginMatch[1] : null;

            console.log("Version Sync Check:");
            console.log(`  package.json:           ${pkgVersion}`);
            console.log(`  server.json (root):     ${serverRootVersion}`);
            console.log(`  server.json (packages): ${serverPkgVersion}`);
            console.log(`  plugin.cfg:             ${pluginVersion}`);

            const mismatches = [];
            if (serverRootVersion && serverRootVersion !== pkgVersion) mismatches.push("server.json.version");
            if (serverPkgVersion && serverPkgVersion !== pkgVersion) mismatches.push("server.json.packages[0].version");
            if (pluginVersion !== pkgVersion) mismatches.push("plugin.cfg");

            if (mismatches.length > 0) {
              console.error(`::error::Version mismatch detected in: ${mismatches.join(", ")}. Expected all to match ${pkgVersion}.`);
              process.exit(1);
            }
            console.log("✅ All versions match!");
          '

          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Release Name: $RELEASE_NAME"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          # 检查 Git Tag
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
            echo "Git tag $TAG already exists."
          else
            TAG_EXISTS=false
          fi

          # 检查 npm 版本
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            NPM_EXISTS=true
            echo "npm version $VERSION already exists."
          else
            NPM_EXISTS=false
          fi

          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "npm_exists=$NPM_EXISTS" >> "$GITHUB_OUTPUT"

          if [[ "$NPM_EXISTS" == "true" && "$TAG_EXISTS" == "false" ]]; then
            echo "::notice::npm version already exists. Skip npm publishing."
            echo "skip_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_npm=false" >> "$GITHUB_OUTPUT"
          fi

      # 6. 创建并推送 Git Tag
      - name: Create and push Git tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          echo "Created and pushed tag: $TAG"

      # 7. 发布 npm
      - name: Publish to npm
        if: steps.version.outputs.skip_npm != 'true'
        run: npm publish --provenance

      # 8. 构建两个安装包（采用 editor-addon 与 ai-server 清晰命名）
      - name: Build release packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          # ========================================
          # A. Godot Editor Addon Plugin
          # ========================================

          PLUGIN_SOURCE="godot_test/addons/vino-godot-mcp"

          if [[ ! -d "$PLUGIN_SOURCE" ]]; then
            echo "::error::Godot plugin directory not found: $PLUGIN_SOURCE"
            exit 1
          fi

          if [[ ! -f "$PLUGIN_SOURCE/plugin.cfg" ]]; then
            echo "::error::plugin.cfg not found"
            exit 1
          fi

          PLUGIN_STAGE="release/plugin-package"

          mkdir -p "$PLUGIN_STAGE/addons"

          cp -a "$PLUGIN_SOURCE" "$PLUGIN_STAGE/addons/vino-godot-mcp"

          PLUGIN_ZIP="vino-godot-mcp-editor-addon-${VERSION}.zip"

          (
            cd "$PLUGIN_STAGE"
            zip -qr "../${PLUGIN_ZIP}" addons
          )

          # ========================================
          # B. AI MCP Server
          # ========================================

          if [[ ! -d "src" ]]; then
            echo "::error::MCP Server source directory not found"
            exit 1
          fi

          if [[ ! -d "dist" ]]; then
            echo "::error::TypeScript output directory dist/ not found"
            exit 1
          fi

          SERVER_STAGE="release/server-package/vino-godot-mcp-server"

          mkdir -p "$SERVER_STAGE"

          cp -a src "$SERVER_STAGE/"
          cp -a dist "$SERVER_STAGE/"
          cp package.json package-lock.json "$SERVER_STAGE/"

          if [[ -f "server.json" ]]; then
            cp server.json "$SERVER_STAGE/"
          fi

          for FILE in README.md LICENSE; do
            if [[ -f "$FILE" ]]; then
              cp "$FILE" "$SERVER_STAGE/"
            fi
          done

          if [[ -d "docs" ]]; then
            cp -a docs "$SERVER_STAGE/"
          fi

          SERVER_ZIP="vino-godot-mcp-ai-server-${VERSION}.zip"

          (
            cd "release/server-package"
            zip -qr "../${SERVER_ZIP}" vino-godot-mcp-server
          )

          # ========================================
          # C. Verify packages
          # ========================================

          test -s "release/${PLUGIN_ZIP}"
          test -s "release/${SERVER_ZIP}"

          echo "Release packages generated:"
          ls -lh release/*.zip

          echo "Plugin ZIP: ${PLUGIN_ZIP}"
          echo "Server ZIP: ${SERVER_ZIP}"

      # 9. 创建或更新 GitHub Release (带产品前缀名称)
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_NAME"

            echo "Updated existing Release: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --generate-notes

            echo "Created Release: $RELEASE_NAME"
          fi

      # 10. 上传带有清晰命名规范的两个安装包
      - name: Upload release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "release/vino-godot-mcp-editor-addon-${VERSION}.zip" \
            "release/vino-godot-mcp-ai-server-${VERSION}.zip" \
            --clobber

          echo "Release packages uploaded successfully."

      # 11. 发布结果
      - name: Publish summary
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          {
            echo "## ${RELEASE_NAME}"
            echo
            echo "### npm"
            echo "- Package: ${PACKAGE_NAME}@${VERSION}"
            echo
            echo "### GitHub Release"
            echo "- Tag: ${TAG}"
            echo "- Godot Editor Addon: vino-godot-mcp-editor-addon-${VERSION}.zip"
            echo "- AI MCP Server: vino-godot-mcp-ai-server-${VERSION}.zip"
            echo
            echo "### Installation packages"
            echo "Both ZIP packages have been uploaded with clear names."
          } >> "$GITHUB_STEP_SUMMARY"